server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://worker:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
