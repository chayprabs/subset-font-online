name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Acceptance (A1)
        run: RUN_ACCEPTANCE=1 pnpm --filter @fontops/core test

      - name: Build web
        run: pnpm --filter @fontops/web build

      - name: E2E
        run: pnpm --filter @fontops/web exec playwright install chromium && pnpm test:e2e

      - name: Build core
        run: pnpm --filter @fontops/core build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install fastapi uvicorn python-multipart fonttools opentype-sanitizer brotli

      - name: Worker health and QA smoke
        run: |
          cd apps/worker
          uvicorn main:app --host 127.0.0.1 --port 8080 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health && break; sleep 1; done
          curl -sf -X POST -F "file=@../../packages/web/public/samples/Inter-Regular.woff2" \
            http://127.0.0.1:8080/v1/qa | grep -q '"checks"'
          curl -sf -X POST -F "file=@../../packages/web/public/samples/Inter-Regular.woff2" \
            http://127.0.0.1:8080/v1/shaping | grep -q '"latin"'

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
